name: Sync OSDR Release Radar Snapshot

on:
  schedule:
    # Every 8 hours UTC (00:00, 08:00, 16:00) monitor for Ryan T. Scott & AWG Lead drops + OSDR releases
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Release Radar from NASA OSDR, ORCID, OpenAlex, Crossref, NTRS, PubMed & Europe PMC (8h check)
        env:
          RADAR_WEBHOOK_URL: ${{ secrets.RADAR_WEBHOOK_URL }}
          RADAR_WEBHOOK_URLS: ${{ secrets.RADAR_WEBHOOK_URLS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RADAR_WEBHOOK_SECRET: ${{ secrets.RADAR_WEBHOOK_SECRET }}
          RADAR_APP_WEBHOOK_URL: ${{ secrets.RADAR_APP_WEBHOOK_URL }}
        run: npx tsx scripts/syncRadarSnapshot.ts --notify

      - name: Check for snapshot changes
        id: diff_check
        run: |
          if git diff --quiet server/radarSnapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild Vercel serverless bundle & run tests
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          npm run build
          npm test

      - name: Commit updated radar snapshot
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/radarSnapshot.json api/serverless.js
          git commit -m "chore(radar): 8h sync NASA OSDR & AWG lead release snapshot"
          git push
