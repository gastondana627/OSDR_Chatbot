name: Sync OSDR Release Radar Snapshot

on:
  schedule:
    # Weekly Monday 13:00 UTC auto-refresh of NASA OSDR releases & AWG Lead Pre-OSDR watch
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Release Radar from NASA OSDR, ORCID, OpenAlex & Europe PMC
        run: npx tsx scripts/syncRadarSnapshot.ts

      - name: Check for snapshot changes
        id: diff_check
        run: |
          if git diff --quiet server/radarSnapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild Vercel serverless bundle & run tests
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          npm run build
          npm test

      - name: Commit updated radar snapshot
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/radarSnapshot.json api/serverless.js
          git commit -m "chore(radar): sync NASA OSDR & AWG lead release snapshot"
          git push
